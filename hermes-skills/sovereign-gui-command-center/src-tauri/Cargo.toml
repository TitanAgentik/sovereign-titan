[package]
name = "sovereign-gui-command-center"
version = "2.0.0"
description = "Sovereign Titan OS — Native Linux Desktop GUI Command Center (Threadripper PRO 9995WX Cores 32-35)"
authors = ["Sovereign Titan OS"]
edition = "2021"

[lib]
name = "sovereign_gui_command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.1", features = ["custom-protocol"] }
tokio = { version = "1.53.3", features = ["full"] }
