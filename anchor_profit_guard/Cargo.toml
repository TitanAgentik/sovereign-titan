[workspace]
resolver = "2"
members = [
    "crates/anchor-lang-compat",
    "programs/profit_guard",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sovereign Titan OS"]

[workspace.dependencies]
borsh = { version = "1.8.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
bs58 = "0.5"
thiserror = "1.0.69"
anchor-lang = { path = "crates/anchor-lang-compat" }
